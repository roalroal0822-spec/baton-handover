# Render(render.com) 공개 시연판 설정. 저장소를 Render에 연결하면 이 파일대로 만들어집니다.
# PUBLIC_DEMO=1: 모델 설정 바꾸기·서버 폴더 읽기를 막고, 화면 위에 '공개 시연판' 안내를 띄웁니다.
# 무료 요금제는 디스크가 임시라 넣은 자료가 재시작 때 지워집니다(시연용으로 의도한 동작).
services:
  - type: web
    name: baton-handover
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py --no-browser
    healthCheckPath: /api/info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_HOST
        value: 0.0.0.0
      - key: PUBLIC_DEMO
        value: "1"
      - key: LLM_PROVIDER
        value: none
      - key: APP_DATA_DIR
        value: /tmp/app-data
